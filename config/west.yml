manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: lotus58_ble_firmware
      url: https://github.com/tCreepyShadow/lotus58_ble_firmware
      revision: main
      path: modules/lotus58_ble_firmware
  self:
    path: config
